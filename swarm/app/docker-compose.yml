services:
  app:
    image: rstarmer/hostname:latest
    deploy:
      mode: replicated
      replicas: 3
    expose:
      - "80"

  nginx-proxy:
    image: nginx:stable-alpine
    ports:
      - 80:8080
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    command: [nginx-debug, '-g', 'daemon off;']
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
